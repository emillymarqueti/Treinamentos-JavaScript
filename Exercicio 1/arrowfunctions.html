<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow</title>
    <script>
        const hello = () => alert("Hello World!");

        // function hello(){
        //     alert("Hello World!");
        // }


        const hello2 = (nome) => alert(`Bem vindo ${nome}!`);

        // function hello2(nome){
        //     alert("Bem vindo " + nome + "!");
        // }
    </script>
</head>
<body>
    <button onclick="hello()">Clique aqui</button>
    <br><br>
    <button onclick="hello2('Amanda')">Clique aqui 2</button>
</body>
</html>
